<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#7f40ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#0d0a12"/>
  <ellipse cx="545" cy="200" rx="280" ry="185" fill="url(#glow)"/>

  <!-- occupancy grid motif: 13 filled, 3 outlined -->
  <rect x="430" y="120" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="472" y="120" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="514" y="120" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="556" y="120" width="28" height="28" rx="8" fill="none" stroke="#c2a4ff" stroke-width="1.5" opacity="0.75"/>
  <rect x="430" y="162" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="472" y="162" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="514" y="162" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="556" y="162" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="430" y="204" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="472" y="204" width="28" height="28" rx="8" fill="none" stroke="#c2a4ff" stroke-width="1.5" opacity="0.75"/>
  <rect x="514" y="204" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="556" y="204" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="430" y="246" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="472" y="246" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>
  <rect x="514" y="246" width="28" height="28" rx="8" fill="none" stroke="#c2a4ff" stroke-width="1.5" opacity="0.75"/>
  <rect x="556" y="246" width="28" height="28" rx="8" fill="url(#sq)" opacity="0.9"/>

  <!-- stat beside grid -->
  <text x="622" y="196" font-size="42" font-weight="600" fill="#eae5ec" letter-spacing="1">87%</text>
  <text x="624" y="220" font-size="12" fill="#837c92" letter-spacing="3">OCCUPANCY</text>

  <!-- category pill -->
  <rect x="40" y="40" width="146" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="113" y="57" font-size="11" fill="#c2a4ff" letter-spacing="2" text-anchor="middle">SAAS - REVENUE</text>

  <!-- title block -->
  <text x="40" y="432" font-size="32" font-weight="600" fill="#eae5ec" letter-spacing="1.5">PG Manager</text>
  <text x="40" y="460" font-size="14" fill="#837c92" letter-spacing="0.5">Multi-role PG management, generating revenue</text>

  <!-- tech chips -->
  <rect x="618" y="436" width="62" height="24" rx="12" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="649" y="452" font-size="11" fill="#c2a4ff" letter-spacing="1" text-anchor="middle">React</text>
  <rect x="690" y="436" width="70" height="24" rx="12" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="725" y="452" font-size="11" fill="#c2a4ff" letter-spacing="1" text-anchor="middle">Node.js</text>
</svg>
