<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#7f40ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0d0a12"/>

  <!-- soft glow behind motif -->
  <circle cx="470" cy="200" r="185" fill="url(#glow)"/>

  <!-- motif: two open hands cradling a rising sun/heart hybrid -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- sun/heart hybrid -->
    <path d="M470 132 C458 116 434 116 426 134 C418 152 434 168 470 192 C506 168 522 152 514 134 C506 116 482 116 470 132 Z" stroke="url(#sun)" stroke-width="2" fill="#7f40ff18"/>
    <!-- rays -->
    <line x1="470" y1="92" x2="470" y2="76" stroke="#c2a4ff" stroke-width="2"/>
    <line x1="416" y1="106" x2="405" y2="94" stroke="#c2a4ff" stroke-width="2"/>
    <line x1="524" y1="106" x2="535" y2="94" stroke="#c2a4ff" stroke-width="2"/>
    <line x1="392" y1="146" x2="376" y2="142" stroke="#c2a4ff" stroke-width="2"/>
    <line x1="548" y1="146" x2="564" y2="142" stroke="#c2a4ff" stroke-width="2"/>
    <!-- left open hand -->
    <path d="M361 262 C367 236 388 220 414 218 L430 217 C420 227 414 236 416 246 C438 236 458 232 470 232" stroke="#eae5ec" stroke-width="2"/>
    <path d="M361 262 C382 280 412 288 470 288" stroke="#eae5ec" stroke-width="2"/>
    <!-- right open hand -->
    <path d="M579 262 C573 236 552 220 526 218 L510 217 C520 227 526 236 524 246 C502 236 482 232 470 232" stroke="#eae5ec" stroke-width="2"/>
    <path d="M579 262 C558 280 528 288 470 288" stroke="#eae5ec" stroke-width="2"/>
  </g>

  <!-- three tiny stat marks -->
  <text x="358" y="330" font-size="12" fill="#837c92" text-anchor="middle" letter-spacing="0.5">600+ trained</text>
  <text x="470" y="330" font-size="12" fill="#837c92" text-anchor="middle" letter-spacing="0.5">240+ placed</text>
  <text x="582" y="330" font-size="12" fill="#837c92" text-anchor="middle" letter-spacing="0.5">35 villages</text>

  <!-- category pill -->
  <rect x="40" y="40" width="164" height="28" rx="14" fill="#16121e" stroke="#c2a4ff33" stroke-width="1"/>
  <circle cx="58" cy="54" r="4" fill="#4ade80"/>
  <text x="70" y="58" font-size="11" fill="#c2a4ff" letter-spacing="1.5">LIVE - NON-PROFIT</text>

  <!-- title + subtitle -->
  <text x="40" y="430" font-size="32" fill="#eae5ec" letter-spacing="1.5" font-weight="600">Dhrishta ERF</text>
  <text x="40" y="456" font-size="14" fill="#837c92" letter-spacing="0.5">CSR education &amp; livelihoods - dhrishtaerf.org</text>

  <!-- tech chips -->
  <g font-size="11" fill="#c2a4ff" letter-spacing="1">
    <rect x="630" y="434" width="60" height="24" rx="12" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
    <text x="660" y="450" text-anchor="middle">cPanel</text>
    <rect x="698" y="434" width="62" height="24" rx="12" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
    <text x="729" y="450" text-anchor="middle">Design</text>
  </g>
</svg>
