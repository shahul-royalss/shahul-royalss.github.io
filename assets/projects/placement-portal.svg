<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <g id="av" fill="none" stroke-width="1.5" stroke-linecap="round">
      <circle r="34"/>
      <circle cy="-8" r="9"/>
      <path d="M -15 18 C -15 6 15 6 15 18"/>
    </g>
  </defs>

  <rect width="800" height="500" fill="#0d0a12"/>
  <ellipse cx="470" cy="210" rx="260" ry="170" fill="url(#glow)"/>

  <!-- four role avatars -->
  <use href="#av" x="326" y="210" stroke="#837c92"/>
  <use href="#av" x="422" y="210" stroke="#837c92"/>
  <use href="#av" x="518" y="210" stroke="#c2a4ff"/>
  <use href="#av" x="614" y="210" stroke="#837c92"/>

  <text x="326" y="282" text-anchor="middle" font-size="11" letter-spacing="1" fill="#837c92">Student</text>
  <text x="422" y="282" text-anchor="middle" font-size="11" letter-spacing="1" fill="#837c92">Staff</text>
  <text x="518" y="282" text-anchor="middle" font-size="11" letter-spacing="1" fill="#c2a4ff">TPO</text>
  <text x="614" y="282" text-anchor="middle" font-size="11" letter-spacing="1" fill="#837c92">Admin</text>

  <!-- stopwatch chip -->
  <rect x="594" y="108" width="112" height="34" rx="17" fill="#16121e" stroke="#c2a4ff33" stroke-width="1"/>
  <circle cx="617" cy="127" r="7.5" fill="none" stroke="#c2a4ff" stroke-width="1.5"/>
  <path d="M 614.5 114.5 h 5 M 617 114.5 v 4" fill="none" stroke="#c2a4ff" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 617 127 l 4 -4" fill="none" stroke="#c2a4ff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="634" y="131" font-size="12" letter-spacing="0.5" fill="#eae5ec">40 min</text>

  <!-- category pill -->
  <rect x="40" y="28" width="186" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="133" y="45" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#c2a4ff">HACKATHON - 2ND PLACE</text>

  <!-- title block -->
  <text x="40" y="430" font-size="32" font-weight="600" letter-spacing="1.5" fill="#eae5ec">Placement Portal</text>
  <text x="40" y="460" font-size="14" letter-spacing="0.3" fill="#837c92">Four-role portal built in a 40-minute round</text>

  <!-- tech chips -->
  <rect x="616" y="414" width="62" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="647" y="431" text-anchor="middle" font-size="12" fill="#c2a4ff">Flask</text>
  <rect x="690" y="414" width="70" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="725" y="431" text-anchor="middle" font-size="12" fill="#c2a4ff">SQLite</text>
</svg>
