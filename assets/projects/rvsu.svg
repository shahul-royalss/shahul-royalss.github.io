<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mstroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#7f40ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#0d0a12"/>

  <circle cx="520" cy="204" r="190" fill="url(#glow)" opacity="0.32"/>

  <!-- browser window -->
  <rect x="365" y="88" width="310" height="232" rx="16" fill="#16121e" stroke="url(#mstroke)" stroke-width="1.5"/>
  <line x1="365" y1="124" x2="675" y2="124" stroke="#c2a4ff" stroke-opacity="0.25" stroke-width="1.5"/>
  <circle cx="389" cy="106" r="3" fill="#837c92"/>
  <circle cx="403" cy="106" r="3" fill="#837c92"/>
  <circle cx="417" cy="106" r="3" fill="#837c92"/>
  <rect x="436" y="97" width="186" height="18" rx="9" fill="#0d0a12"/>
  <text x="529" y="110" font-size="11" fill="#837c92" letter-spacing="1" text-anchor="middle">rvsu.org</text>

  <!-- graduation cap -->
  <path d="M 520 175 L 588 202 L 520 229 L 452 202 Z" fill="none" stroke="url(#mstroke)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 487 214 V 236 C 487 247 553 247 553 236 V 214" fill="none" stroke="url(#mstroke)" stroke-width="2" stroke-linecap="round"/>
  <line x1="588" y1="202" x2="588" y2="230" stroke="#c2a4ff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="588" cy="236" r="3.5" fill="#c2a4ff"/>
  <rect x="480" y="270" width="80" height="5" rx="2.5" fill="url(#mstroke)"/>

  <!-- pill -->
  <rect x="40" y="40" width="188" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <circle cx="58" cy="53" r="3.5" fill="#4ade80"/>
  <text x="69" y="57" font-size="11" fill="#c2a4ff" letter-spacing="1.5">LIVE - CLIENT WORK</text>

  <!-- title -->
  <text x="40" y="432" font-size="32" font-weight="600" fill="#eae5ec" letter-spacing="1.5">RVS University</text>
  <text x="40" y="458" font-size="14" fill="#837c92" letter-spacing="0.5">Official university portal - rvsu.org</text>

  <!-- chips -->
  <rect x="618" y="428" width="84" height="24" rx="12" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="660" y="443.5" font-size="11" fill="#c2a4ff" text-anchor="middle" letter-spacing="0.5">Hostinger</text>
  <rect x="712" y="428" width="48" height="24" rx="12" fill="#c2a4ff10" stroke="#c2a4ff33" stroke-width="1"/>
  <text x="736" y="443.5" font-size="11" fill="#c2a4ff" text-anchor="middle" letter-spacing="0.5">DNS</text>
</svg>
