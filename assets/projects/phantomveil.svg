<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="pvGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7f40ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#7f40ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7f40ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pvFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2a4ff"/>
      <stop offset="55%" stop-color="#c2a4ff"/>
      <stop offset="100%" stop-color="#c2a4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#0d0a12"/>
  <circle cx="528" cy="205" r="215" fill="url(#pvGlow)"/>

  <!-- photo-frame motif, right edge dissolving -->
  <rect x="420" y="110" width="210" height="190" rx="24" fill="#16121e" stroke="url(#pvFade)" stroke-width="2"/>
  <circle cx="478" cy="168" r="15" fill="none" stroke="#c2a4ff" stroke-width="1.5"/>
  <path d="M444 282 L504 202 L540 248 L576 210 L622 282" fill="none" stroke="url(#pvFade)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- drift of binary dissolving off the right edge -->
  <g font-size="13" fill="#c2a4ff">
    <text x="650" y="152" opacity="0.55">1</text>
    <text x="676" y="134" opacity="0.4">0</text>
    <text x="702" y="170" opacity="0.28">1</text>
    <text x="658" y="200" opacity="0.5">0</text>
    <text x="688" y="216" opacity="0.35">1</text>
    <text x="716" y="190" opacity="0.2" font-size="11">0</text>
    <text x="652" y="248" opacity="0.45">1</text>
    <text x="682" y="264" opacity="0.3">0</text>
    <text x="712" y="240" opacity="0.18" font-size="11">1</text>
    <text x="738" y="208" opacity="0.12" font-size="11">0</text>
  </g>

  <!-- tiny ghost floating at the frame corner -->
  <path d="M601 96 v-13 a11 11 0 0 1 22 0 v13 l-3.7 -3.2 -3.6 3.2 -3.7 -3.2 -3.6 3.2 -3.7 -3.2 z" fill="#0d0a12" stroke="#c2a4ff" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="608" cy="82" r="1.6" fill="#c2a4ff"/>
  <circle cx="616" cy="82" r="1.6" fill="#c2a4ff"/>

  <!-- category pill -->
  <rect x="40" y="40" width="160" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33"/>
  <text x="120" y="57" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#c2a4ff">OPEN SOURCE - MIT</text>

  <!-- title + subtitle -->
  <text x="40" y="430" font-size="32" letter-spacing="1.5" fill="#eae5ec">phantomveil</text>
  <text x="40" y="459" font-size="14.5" fill="#837c92">Hide encrypted data inside images &amp; text</text>

  <!-- tech chips -->
  <rect x="592" y="424" width="72" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33"/>
  <text x="628" y="441" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#c2a4ff">Python</text>
  <rect x="676" y="424" width="84" height="26" rx="13" fill="#c2a4ff10" stroke="#c2a4ff33"/>
  <text x="718" y="441" text-anchor="middle" font-size="11" letter-spacing="0.5" fill="#c2a4ff">AES-256</text>
</svg>
